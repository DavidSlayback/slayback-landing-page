name: CI
# CI runs when work is ready to merge, not on every push while it's in progress:
# - PRs build only when they target main and aren't drafts. Open PRs as drafts while iterating; marking one ready
#   for review runs CI (and later pushes to a ready PR re-run it, cancelling any older run).
# - Stacked PRs (based on another branch) don't build until they're retargeted to main.
# - Docs-only PRs never need a build. Pushes to main always run (they deploy). `workflow_dispatch` runs it by hand.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: PRs restore main's cache instead of each storing a ~1-2 GB copy (the repo limit is 10 GB).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Default members only: sim, hero-wasm, game-core (the Bevy shell is checked in the game job).
      - run: cargo test --release
      - run: cargo clippy --all-targets --release -- -D warnings
      - run: SKIP_GAME=1 bash scripts/build.sh
      - name: hero.wasm size budget (80 KB)
        run: test "$(wc -c < dist/hero.wasm)" -le 81920
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  game:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: PRs restore main's cache instead of each storing a ~1-2 GB copy (the repo limit is 10 GB).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # wasm-bindgen-cli must match the wasm-bindgen crate in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: cargo clippy -p game --target wasm32-unknown-unknown --profile game -- -D warnings
      # The release switch is ON here so the browser job can test the game's entry points. This artifact is
      # test-only: deploys ship the build job's switch-off `dist`, never this.
      - run: bash scripts/build.sh
        env:
          GAME_RELEASE: 1
      - uses: actions/upload-artifact@v4
        with:
          name: dist-with-game
          path: dist

  # Headless game scenarios (ticket A4, crates/game/tests): real game systems, no window or GPU, native Linux.
  game-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: PRs restore main's cache instead of each storing a ~1-2 GB copy (the repo limit is 10 GB).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Headless: without the `render` feature, so changes to the renderer, UI or audio features don't rebuild Bevy's
      # rendering crates here (that cost ~13 min a run). The wasm build in the `game` job still covers `render`.
      - run: cargo test -p game --no-default-features
      - run: cargo clippy -p game --no-default-features --all-targets -- -D warnings

  # Browser smoke harness (tickets A3, C4; tests/e2e) against both builds: the full switch-on build (/play and the
  # game's entry points) and the deployable switch-off build (no way into the game).
  browser:
    needs: [build, game]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-with-game
          path: dist-with-game
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # REQUIRE_GAME turns a missing game build into a failure instead of a skip.
      - name: Test the switch-on build (with the game)
        run: npx playwright test --output test-results/switch-on
        env:
          DIST: ../../dist-with-game
          GAME_RELEASE: 1
          REQUIRE_GAME: 1
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/switch-on
      - name: Test the switch-off build (what deploys)
        if: ${{ !cancelled() }}
        run: npx playwright test --output test-results/switch-off
        env:
          DIST: ../../dist
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/switch-off
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results

  # Homepage deploys (ticket C1): main → production, same-repo PRs → preview. Hero only: the game stays out of
  # deploys until its release switch flips (tickets C4 / E1). Direct Upload, so the project can't move to
  # Cloudflare's Git integration later; that is intended (our CI does the build).
  deploy:
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Fail fast with a readable message (never echoes the value): account IDs are 32 lowercase hex characters.
      - name: Check the account ID format
        run: |
          id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [[ "$id" =~ ^[0-9a-f]{32}$ ]]; then echo "account ID format ok"; else
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not a 32-character hex account ID (got ${#id} characters). Copy 'Account ID' from the Cloudflare dashboard overview, not a zone ID, name or email."; exit 1; fi
      - name: Ensure the Pages project exists
        run: |
          out="$(npx --yes wrangler@4 pages project create slayback --production-branch=main 2>&1)" && { echo "$out"; exit 0; }
          echo "$out"
          # Only "already exists" is fine; anything else (bad ID, missing permission) must fail here, not later.
          grep -qiE "already exists|8000002" <<<"$out"
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=slayback --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Report the URL
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" | tee -a "$GITHUB_STEP_SUMMARY"

