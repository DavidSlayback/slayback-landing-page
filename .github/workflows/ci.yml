name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Default members only: sim, hero-wasm, game-core (the Bevy shell is checked in the game job).
      - run: cargo test --release
      - run: cargo clippy --all-targets --release -- -D warnings
      - run: SKIP_GAME=1 bash scripts/build.sh
      - name: hero.wasm size budget (80 KB)
        run: test "$(wc -c < dist/hero.wasm)" -le 81920
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # wasm-bindgen-cli must match the wasm-bindgen crate in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: cargo clippy -p game --target wasm32-unknown-unknown --profile game -- -D warnings
      - run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist-with-game
          path: dist

  # Homepage deploys (ticket C1): main → production, same-repo PRs → preview. Hero only: the game stays out of
  # deploys until its release switch flips (tickets C4 / E1). Direct Upload, so the project can't move to
  # Cloudflare's Git integration later; that is intended (our CI does the build).
  deploy:
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      # Fail fast with a readable message (never echoes the value): account IDs are 32 lowercase hex characters.
      - name: Check the account ID format
        run: |
          id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [[ "$id" =~ ^[0-9a-f]{32}$ ]]; then echo "account ID format ok"; else
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not a 32-character hex account ID (got ${#id} characters). Copy 'Account ID' from the Cloudflare dashboard overview, not a zone ID, name or email."; exit 1; fi
      - name: Ensure the Pages project exists
        run: |
          out="$(npx --yes wrangler@4 pages project create slayback --production-branch=main 2>&1)" && { echo "$out"; exit 0; }
          echo "$out"
          # Only "already exists" is fine; anything else (bad ID, missing permission) must fail here, not later.
          grep -qiE "already exists|8000002" <<<"$out"
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=slayback --branch=${{ github.head_ref || github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Report the URL
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" | tee -a "$GITHUB_STEP_SUMMARY"

