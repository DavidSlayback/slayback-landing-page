name: CI

# Feature branches get one cheap job; the expensive work (the wasm game build, the browser harness, deploys) runs
# only on main and release candidates (decisions Q41, Q42).
# - Pull requests into main build only when not drafts. PRs (stacked ones included) stay drafts while iterating and
#   restacking; mark one ready only to merge it now, so each PR builds once (decision Q44). Docs-only PRs skip.
#   Stacked PRs don't build until retargeted to main.
# - main deploys production (the hero; the game stays behind its release switch). A branch named rc/... deploys a
#   preview of the full build with the game's release switch on.
on:
  push:
    branches: [main, 'rc/**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

# A newer run supersedes an older one on the same PR or branch, main included: merging a stack lands several commits
# in a row, and only the last needs building and deploying.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # CI compiles each crate once: incremental artifacts only bloat the cache.
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: never

jobs:
  # Everything a PR needs, in one job (one toolchain setup, one cache): unit and headless game tests, clippy, and the
  # hero build with its size budget. The headless game builds without the `render` feature (no Bevy renderer).
  # The local hooks (.pre-commit-config.yaml) run the same commands; keep the two in step.
  check:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: check
          # Only main saves; PRs restore main's cache instead of storing their own copies (repo limit 10 GB).
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo test --release --locked
      # The headless game, and the ML track's crates over it (the env, its MCP server, the benchmark runner).
      - run: cargo test -p game3d -p box-env -p box-mcp -p box-bench --no-default-features --locked
      # game3d's unit tests behind `render` (figure, paint) need Bevy's Linux audio and gamepad headers. Binaryen's
      # wasm-opt shrinks hero.wasm as every deploy from a workstation does, so the budget below measures what ships.
      - run: sudo apt-get update -q && sudo apt-get install -yq libasound2-dev libudev-dev binaryen
      - run: cargo test -p game3d --lib --locked
      - run: cargo clippy --all-targets --release -- -D warnings
      - run: cargo clippy -p game3d -p box-env -p box-mcp -p box-bench --no-default-features --all-targets -- -D warnings
      - run: SKIP_GAME=1 bash scripts/build.sh
      - name: hero.wasm size budget (80 KB)
        run: test "$(wc -c < dist/hero.wasm)" -le 81920
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # The shipping wasm game (fat LTO, ~5 min even when cached): main and release candidates only. The artifact has
  # the release switch on; it's deployed only from rc/ branches.
  game:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: game
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # wasm-bindgen-cli must match the wasm-bindgen crate in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: cargo clippy -p game3d --target wasm32-unknown-unknown --profile game -- -D warnings
      - run: bash scripts/build.sh
        env:
          GAME_RELEASE: 1
      - uses: actions/upload-artifact@v4
        with:
          name: dist-with-game
          path: dist

  # Browser harness (tests/e2e) against both builds: the full switch-on build (/play and the game's entry points)
  # and the hero-only dist that main deploys.
  browser:
    needs: [check, game]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist-with-game
          path: dist-with-game
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
      # Playwright's Chromium, cached by the Playwright version in the lockfile.
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/e2e/package-lock.json') }}
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - run: npx playwright install-deps chromium
      # REQUIRE_GAME turns a missing game build into a failure instead of a skip.
      - name: Test the switch-on build (with the game)
        run: npx playwright test --output test-results/switch-on
        env:
          DIST: ../../dist-with-game
          GAME_RELEASE: 1
          REQUIRE_GAME: 1
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/switch-on
      - name: Test the switch-off build (what main deploys)
        if: ${{ !cancelled() }}
        run: npx playwright test --output test-results/switch-off
        env:
          DIST: ../../dist
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/switch-off
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results

  # Deploys (ticket C1): main -> production (hero only); rc/... -> a preview with the game. Direct Upload, so the
  # project can't move to Cloudflare's Git integration later; that is intended (our CI does the build).
  deploy:
    needs: [check, game]
    # main ships the hero even if the game build failed; an rc/ preview needs the game.
    if: >-
      always() && github.event_name == 'push' && needs.check.result == 'success' &&
      (github.ref_name == 'main' || needs.game.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ startsWith(github.ref_name, 'rc/') && 'dist-with-game' || 'dist' }}
          path: dist
      # Fail fast with a readable message (never echoes the value): account IDs are 32 lowercase hex characters.
      - name: Check the account ID format
        run: |
          id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [[ "$id" =~ ^[0-9a-f]{32}$ ]]; then echo "account ID format ok"; else
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not a 32-character hex account ID (got ${#id} characters). Copy 'Account ID' from the Cloudflare dashboard overview, not a zone ID, name or email."; exit 1; fi
      - name: Ensure the Pages project exists
        run: |
          out="$(npx --yes wrangler@4 pages project create slayback --production-branch=main 2>&1)" && { echo "$out"; exit 0; }
          echo "$out"
          # Only "already exists" is fine; anything else (bad ID, missing permission) must fail here, not later.
          grep -qiE "already exists|8000002" <<<"$out"
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=slayback --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Report the URL
        run: echo "Deployed to ${{ steps.deploy.outputs.deployment-url }}" | tee -a "$GITHUB_STEP_SUMMARY"
