[workspace]
resolver = "3"
members = ["crates/sim", "crates/hero-wasm", "crates/game-core", "crates/game3d", "crates/box-env", "crates/box-mcp", "crates/box-bench"]
# The game (Bevy) only targets wasm32 in CI and pull native windowing deps elsewhere; plain `cargo test` skips it.
default-members = ["crates/sim", "crates/hero-wasm", "crates/game-core"]

[workspace.package]
edition = "2024"
publish = false

# Dev profile = the fast iteration loop (`trunk serve`, native runs): no debug info (it would bloat the wasm to
# hundreds of MB), light optimisation for our crates, dependencies optimised because Bevy is unusably slow at -O0.
[profile.dev]
debug = false
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# The game's web build: size first. Fat LTO + one codegen unit lets dead code go across crate boundaries,
# which matters far more for a Bevy wasm than speed of the build.
[profile.game]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
debug = false
strip = true   # without this the web build carries ~70 MB of symbols and debug info
