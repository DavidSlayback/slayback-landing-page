<!doctype html>
<!--
  PROTOTYPE — throwaway visual spike, round 2. Not production code.
  Question: which high-motion, high-contrast neon hero wows?
  Variants (?variant=, bottom bar, or ←/→):
    hypercube — a 4D tesseract built from particles; grains burst from its core, swirl, pool onto its edges, drain back.
    sandfall  — Rumble Box arena: neon sand pours from roaming spouts, piles in strata around the name, drains through vents.
    vortex    — a fountain feeds a whirlpool that pools into the name; the name is continuously rebuilt.
  Schemes (?palette=, second bar control, or P): netrunner, synthwave, gold.
  ?capture=1 frame-exact recording mode · ?warm=<frames> pre-run · ?n=<side> particle grid override.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero Spike 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Orbitron:wght@800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --bg: #000; --fg: #eafffb; --muted: #6f8f8a; --accent: #00f0ff; --font: system-ui; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); }
  .hero { position: relative; height: 100vh; height: 100svh; overflow: hidden; background: #000; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .projects { max-width: 760px; margin: 0 auto; padding: 96px 16px 160px; }
  .projects h2 { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .projects ul { list-style: none; padding: 0; margin: 0; }
  .projects li { display: flex; justify-content: space-between; gap: 16px; padding: 18px 0; border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
  .projects a { color: var(--fg); text-decoration: none; font-size: 22px; font-weight: 600; }
  .projects a:hover { color: var(--accent); }
  .projects span { color: var(--muted); font-size: 14px; align-self: center; }
  .hud { position: fixed; top: 12px; left: 12px; z-index: 10; pointer-events: none; white-space: pre-wrap; max-width: calc(100vw - 24px);
    font: 12px/1.5 ui-monospace, Consolas, monospace; color: #cfd3e0; background: rgba(0,0,0,.6); padding: 8px 10px; border-radius: 8px; }
  .switcher { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 10;
    display: flex; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 32px); align-items: center; gap: 10px;
    background: #fff; color: #111; border-radius: 999px; padding: 6px 8px; box-shadow: 0 6px 24px rgba(0,0,0,.5); font: 600 13px system-ui, sans-serif; }
  .switcher button { border: 0; background: #111; color: #fff; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 14px; }
  .switcher .sep { width: 1px; height: 20px; background: #ccc; margin: 0 4px; }
  @media (max-width: 480px) { .switcher { font-size: 12px; border-radius: 20px; } .switcher .sep { display: none; } }
  .err { position: absolute; inset: auto 16px 40% 16px; text-align: center; color: #ff8a80; font: 14px ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<section class="hero">
  <canvas id="c" aria-hidden="true"></canvas>
  <h1 class="sr-only">David Slayback</h1>
  <p class="err" id="err" hidden></p>
</section>
<section class="projects">
  <h2>Projects</h2>
  <ul>
    <li><a href="#">Project one ↗</a><span>Placeholder description</span></li>
    <li><a href="#">Project two ↗</a><span>Placeholder description</span></li>
    <li><a href="#">Project three ↗</a><span>Placeholder description</span></li>
  </ul>
</section>
<div class="hud" id="hud"></div>
<nav class="switcher" aria-label="Prototype variant">
  <button id="prev" type="button" aria-label="Previous variant">‹</button>
  <span id="vlabel"></span>
  <button id="next" type="button" aria-label="Next variant">›</button>
  <span class="sep"></span>
  <button id="pprev" type="button" aria-label="Previous palette">‹</button>
  <span id="plabel"></span>
  <button id="pnext" type="button" aria-label="Next palette">›</button>
</nav>
<script>
'use strict';
const VARIANTS = [
  { key: 'hypercube', label: 'A · Hypercube' },
  { key: 'sandfall', label: 'B · Sandfall' },
  { key: 'vortex', label: 'C · Vortex pool' },
];
// Pure black ground, four saturated neon stops per scheme; text gets a fill and a brighter stroke colour.
const PALETTES = [
  { key: 'netrunner', label: 'Netrunner', font: '"Chakra Petch"', weight: 700, track: 0.04,
    css: { fg: '#dffff8', muted: '#4f9f90', accent: '#00ffb0' },
    gl: { uP0: [0.0, 0.9, 1.0], uP1: [0.1, 1.0, 0.35], uP2: [0.0, 0.35, 1.0], uP3: [0.55, 1.0, 0.9],
      uFillCol: [0.7, 1.0, 0.95], uStrokeCol: [0.0, 1.0, 0.7] } },
  { key: 'synthwave', label: 'Synthwave', font: '"Orbitron"', weight: 900, track: 0.06,
    css: { fg: '#ffe9fb', muted: '#a0609a', accent: '#ff2bd6' },
    gl: { uP0: [1.0, 0.08, 0.72], uP1: [0.0, 0.9, 1.0], uP2: [1.0, 0.92, 0.05], uP3: [0.5, 0.15, 1.0],
      uFillCol: [1.0, 0.85, 0.98], uStrokeCol: [1.0, 0.15, 0.8] } },
  { key: 'gold', label: 'Human Revolution', font: '"Rajdhani"', weight: 700, track: 0.16,
    css: { fg: '#fff1d0', muted: '#a07a35', accent: '#ffae2b' },
    gl: { uP0: [1.0, 0.55, 0.04], uP1: [1.0, 0.82, 0.2], uP2: [1.0, 0.3, 0.0], uP3: [1.0, 0.95, 0.65],
      uFillCol: [1.0, 0.9, 0.65], uStrokeCol: [1.0, 0.62, 0.1] } },
];
const qs = new URLSearchParams(location.search);
let vi = Math.max(0, VARIANTS.findIndex(v => v.key === qs.get('variant')));
let pi = Math.max(0, PALETTES.findIndex(p => p.key === qs.get('palette')));
const sideOverride = parseInt(qs.get('n'), 10) || 0;
const compact = Math.min(innerWidth, innerHeight) < 600;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const capture = qs.has('capture');
const FONT = '"Segoe UI",system-ui,-apple-system,Arial,sans-serif';
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const canvas = document.getElementById('c'), hud = document.getElementById('hud');

function fail(msg) { const e = document.getElementById('err'); e.textContent = msg; e.hidden = false; throw new Error(msg); }
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
if (!gl) fail('WebGL2 unavailable');
if (!gl.getExtension('EXT_color_buffer_float')) fail('EXT_color_buffer_float unavailable');
gl.bindVertexArray(gl.createVertexArray());

// ---------- GLSL ----------
const HEAD = '#version 300 es\nprecision highp float;\nprecision highp int;\nprecision highp sampler2D;\nprecision highp usampler2D;\n';
// Classic 3D simplex noise, Ashima Arts / Stefan Gustavson (MIT).
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;
const COMMON = `
float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
uniform vec3 uP0, uP1, uP2, uP3;
vec3 pal(float t){ t=fract(t)*4.0;
  if(t<1.0) return mix(uP0,uP1,t); if(t<2.0) return mix(uP1,uP2,t-1.0); if(t<3.0) return mix(uP2,uP3,t-2.0); return mix(uP3,uP0,t-3.0); }
// Tesseract: 16 vertices (±1)^4, 32 edges. Rotate in 4D, perspective-project 4D→3D→screen.
uniform mat4 uRot4; uniform vec2 uTC; uniform float uTScale, uWD, uCamZ;
vec4 tessVert(int i){ return vec4(float(i&1),float((i>>1)&1),float((i>>2)&1),float((i>>3)&1))*2.0-1.0; }
int insertZeroBit(int j,int k){ int lo=(1<<k)-1; return (j&lo)|((j&~lo)<<1); }
vec4 tessPoint(float e,float s){            // → screen.xy, w (4th coord after rotation), depth scale
  int ei=int(e+0.5), k=ei/8, a=insertZeroBit(ei-k*8,k), b=a|(1<<k);
  vec4 P=uRot4*mix(tessVert(a),tessVert(b),s);
  vec3 p3=P.xyz/(uWD-P.w); float pz=1.0/(uCamZ-p3.z);
  return vec4(uTC+p3.xy*pz*uTScale, P.w, pz);
}`;
const VS_TRI = HEAD + `void main(){ vec2 p=vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position=vec4(p*2.0-1.0,0.0,1.0); }`;

// Stream sim (variants A and C). S0 = pos.xy, vel.xy; S1 = age, capture time, pooled time, release time.
// Life cycle: launch from source → ride the vortex → captured (spring to home) → released → respawn.
const FS_STREAM = HEAD + NOISE + COMMON + `
uniform sampler2D uS0, uS1, uHome;
uniform float uMode, uTime, uDt, uSeed, uR0, uSwirl, uInflow, uTurb, uTube;
uniform vec2 uCapT;
uniform vec2 uRes, uSrc, uCenter, uLaunch;
uniform vec4 uMouse, uPulse;
layout(location=0) out vec4 o0; layout(location=1) out vec4 o1;
void main(){
  ivec2 c=ivec2(gl_FragCoord.xy); vec2 fc=vec2(c);
  vec4 s0=texelFetch(uS0,c,0), s1=texelFetch(uS1,c,0), h=texelFetch(uHome,c,0);
  vec2 p=s0.xy, v=s0.zw; float age=s1.x+uDt, tc=s1.y, tp=s1.z, tr=s1.w;
  if(age<0.0){ o0=vec4(uSrc,0.0,0.0); o1=vec4(age,tc,tp,tr); return; }
  bool respawn = age>tc+tp+tr || p.x<-300.0 || p.x>uRes.x+300.0 || p.y<-300.0 || p.y>uRes.y+300.0;
  if(uMode>0.5 && age>tc+tp+0.8 && length(p-uCenter)<uR0*0.07) respawn=true;   // fell back into the core
  if(respawn){
    vec2 q=fc+uSeed*vec2(173.0,59.0);
    float r1=hash12(q), r2=hash12(q+7.7), r3=hash12(q+19.3), r4=hash12(q+31.1), r5=hash12(q+43.9);
    float ang = uMode>0.5 ? r1*6.2831853 : -1.5707963+(r1-0.5)*0.75;
    vec2 dir=vec2(cos(ang),sin(ang));
    p=uSrc+dir*(uMode>0.5?6.0:3.0)+vec2(r5-0.5,0.0)*24.0*(1.0-uMode); v=dir*mix(uLaunch.x,uLaunch.y,r2);
    age=0.0; tc=mix(uCapT.x,uCapT.y,r3); tp=mix(3.0,7.0,r4); tr=mix(2.0,4.0,r5);
  }
  vec2 home;
  if(uMode<0.5) home=h.xy;
  else { float s=0.5-0.5*cos(h.y+uTime*h.z); home=tessPoint(h.x,s).xy+(vec2(hash12(fc*1.3),hash12(fc*1.7+5.0))-0.5)*uTube; }
  float cap=smoothstep(tc,tc+0.9,age)*(1.0-smoothstep(tc+tp,tc+tp+0.3,age));
  vec2 d=p-uCenter; float r=length(d)+1e-3, qn=r/uR0;
  vec2 flowV=vec2(-d.y,d.x)/r*uSwirl*2.0*qn/(1.0+qn*qn) - d/r*uInflow
    + vec2(snoise(vec3(p*0.0035,uTime*0.25)), snoise(vec3(p*0.0035+19.0,uTime*0.25)))*uTurb;
  vec2 aFree=(flowV-v)*1.7;
  float w=6.2831853*mix(0.9,1.7,h.w);
  vec2 aCap=(home-p)*w*w - v*(2.0*0.55*w) + vec2(snoise(vec3(h.xy*0.02,uTime*0.6)),snoise(vec3(h.xy*0.02+9.0,uTime*0.6)))*90.0;
  vec2 a=mix(aFree,aCap,cap);
  if(uMouse.z>0.5){
    vec2 dm=uMouse.xy-p; float rm=length(dm)+8.0;
    a+=(1.0-cap)*dm/rm*min(5.0e6/(rm*rm),6000.0);                 // gravity well for free grains
    if(rm<140.0) a-=cap*dm/rm*(1.0-rm/140.0)*14000.0;              // pooled grains part around the cursor
  }
  if(uPulse.z<1.4){
    vec2 dp=p-uPulse.xy; float rp=length(dp), k=exp(-pow((rp-uPulse.z*950.0)/70.0,2.0));
    a+=dp/max(rp,1.0)*k*uPulse.w*(1.0-uPulse.z/1.4);
    if(k>0.4 && cap>0.3) age=max(age,tc+tp);                       // the wave releases pooled grains
  }
  v+=a*uDt; p+=v*uDt;
  o0=vec4(p,v); o1=vec4(age,tc,tp,tr);
}`;

const VS_STREAM = HEAD + COMMON + `
uniform sampler2D uS0, uS1, uHome; uniform int uSide; uniform vec2 uRes, uCenter;
uniform float uMode, uTime, uSize, uGain, uFreeGain;
out vec4 vCol;
void main(){
  ivec2 c=ivec2(gl_VertexID%uSide, gl_VertexID/uSide);
  vec4 s0=texelFetch(uS0,c,0), s1=texelFetch(uS1,c,0), h=texelFetch(uHome,c,0);
  if(s1.x<0.0){ gl_Position=vec4(2.0,2.0,0.0,1.0); gl_PointSize=0.0; vCol=vec4(0.0); return; }
  float age=s1.x, cap=smoothstep(s1.y,s1.y+0.9,age)*(1.0-smoothstep(s1.y+s1.z,s1.y+s1.z+0.3,age));
  float sp=length(s0.zw), size=uSize, hue;
  vec2 d=s0.xy-uCenter;
  float hueFree=atan(d.y,d.x)/6.2831853+uTime*0.04;
  if(uMode<0.5) hue=h.x/uRes.x*1.1+uTime*0.03;
  else { vec4 tp=tessPoint(h.x,0.5-0.5*cos(h.y+uTime*h.z)); hue=tp.z*0.25+0.5+uTime*0.03; size*=mix(1.0,clamp(tp.w*4.0,0.7,1.6),cap); }
  vec3 col=pal(mix(hueFree,hue,cap));
  col=mix(col,vec3(1.0),smoothstep(900.0,1800.0,sp)*0.4);
  float fadeIn=smoothstep(0.0,0.15,age);
  vCol=vec4(col*uGain*mix(uFreeGain,1.0,cap)*(1.0+smoothstep(250.0,1100.0,sp))*fadeIn,1.0);
  gl_Position=vec4(s0.x/uRes.x*2.0-1.0, 1.0-s0.y/uRes.y*2.0, 0.0, 1.0);
  gl_PointSize=size;
}`;
// Round sprite with a white-hot core: each grain reads as its own object.
const FS_SPRITE = HEAD + `in vec4 vCol; out vec4 o;
void main(){ vec2 q=gl_PointCoord*2.0-1.0; float d2=dot(q,q); if(d2>1.0) discard;
  o=vec4(vCol.rgb*exp(-d2*4.0) + vec3(exp(-d2*18.0))*0.3*length(vCol.rgb), 1.0); }`;

// Tesseract vertices as big glowing nodes (positions from the CPU).
const VS_NODES = HEAD + COMMON + `
uniform vec4 uNode[16]; uniform vec2 uRes; uniform float uDpr;
out vec4 vCol;
void main(){ vec4 n=uNode[gl_VertexID];
  gl_Position=vec4(n.x/uRes.x*2.0-1.0, 1.0-n.y/uRes.y*2.0, 0.0, 1.0);
  gl_PointSize=clamp(n.w*30.0,6.0,26.0)*uDpr; vCol=vec4(pal(n.z*0.25+0.5)*2.2,1.0); }`;

// Sandfall: Margolus-neighbourhood falling-sand cellular automaton on an RGBA8UI grid (y-up).
// Cell: x = type (0 empty, 1 sand, 2 wall), y = hue byte, z = motion energy, w = grain id.
const FS_SAND = HEAD + `
uniform usampler2D uG; uniform ivec2 uSize, uOff; uniform float uSeed, uTime;
uniform vec4 uSpoutA, uSpoutB, uCursor, uBlast;   // spouts/cursor: gx, gy, radius, rate · blast: gx, gy, radius, on
uniform vec3 uDrain;                               // open, slot count, slot width
out uvec4 o;
float hash12(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
uvec4 at(ivec2 p){ if(p.x<0||p.y<0||p.x>=uSize.x||p.y>=uSize.y) return uvec4(2u,0u,0u,0u); return texelFetch(uG,p,0); }
void sw(inout uvec4 a, inout uvec4 b){ uvec4 t=a; a=b; b=t; }
uvec4 spawn(vec2 c, float hue){ return uvec4(1u, uint(fract(hue)*255.0), 255u, uint(hash12(c+uSeed*3.1)*255.0)); }
void main(){
  ivec2 c=ivec2(gl_FragCoord.xy); vec2 fc=vec2(c);
  ivec2 blk=ivec2(floor(vec2(c-uOff)*0.5)), org=blk*2+uOff, l=c-org;
  uvec4 BL=at(org), BR=at(org+ivec2(1,0)), TL=at(org+ivec2(0,1)), TR=at(org+ivec2(1,1));
  uvec4 i0 = l.y==0 ? (l.x==0?BL:BR) : (l.x==0?TL:TR);
  float r=hash12(vec2(blk)+uSeed*vec2(37.1,11.7)), r2=hash12(vec2(blk)+uSeed*vec2(5.3,71.9)+3.0);
  if(TL.x==1u && BL.x==0u) sw(TL,BL);
  if(TR.x==1u && BR.x==0u) sw(TR,BR);
  if(r<0.5){
    if(TL.x==1u && BL.x!=0u && BR.x==0u && r2<0.9) sw(TL,BR);
    else if(TR.x==1u && BR.x!=0u && BL.x==0u && r2<0.9) sw(TR,BL);
  } else {
    if(TR.x==1u && BR.x!=0u && BL.x==0u && r2<0.9) sw(TR,BL);
    else if(TL.x==1u && BL.x!=0u && BR.x==0u && r2<0.9) sw(TL,BR);
  }
  uvec4 m = l.y==0 ? (l.x==0?BL:BR) : (l.x==0?TL:TR);
  if(m.x==1u){ bool moved=any(notEqual(m.xyw,i0.xyw)); m.z = moved ? 255u : (m.z>5u ? m.z-5u : 0u); }
  if(m.x==0u){
    float rs=hash12(fc+uSeed*vec2(13.7,7.1));
    if(abs(fc.x-uSpoutA.x)<=uSpoutA.z && abs(fc.y-uSpoutA.y)<1.0 && rs<uSpoutA.w) m=spawn(fc,uTime*0.07);
    else if(abs(fc.x-uSpoutB.x)<=uSpoutB.z && abs(fc.y-uSpoutB.y)<1.0 && rs<uSpoutB.w) m=spawn(fc,uTime*0.07+0.5);
    else if(uCursor.w>0.0 && distance(fc,uCursor.xy)<uCursor.z && rs<uCursor.w) m=spawn(fc,uTime*0.07+0.25);
  }
  if(m.x==1u && uBlast.w>0.0 && distance(fc,uBlast.xy)<uBlast.z) m=uvec4(0u);
  if(m.x==1u && m.z==0u && hash12(fc*0.91+uSeed*vec2(2.3,8.9))<0.00025) m=uvec4(0u);   // settled grains slowly sublimate
  if(m.x==1u && c.y==0 && uDrain.x>0.5){            // vents in the floor

}
let simT = 0;

let last = 0, frames = 0, fpsT = 0, fps = 0;

    hud.textContent = `${VARIANTS[vi].label} / ${pal().label} — ${cur.N.toLocaleString()} ${VARIANTS[vi].key === 'sandfall' ? 'cells' : 'particles'} · ${fps.toFixed(0)} fps\n${cur.hint} · ←/→ variant · p: scheme`; }
  if (scrollY > H) return;

}
// ?capture=1: no rAF loop and no chrome; a recorder calls __capture.frame(dt) once per output frame.
if (capture) document.querySelectorAll('.hud, .switcher').forEach(e => e.hidden = true);
build().then(() => {
  for (let i = 0, n = parseInt(qs.get('warm'), 10) || 0; i < n; i++) present(1 / 60);
  if (capture) window.__capture = { frame: present };

    for (let i = 0; i < 300; i++) present(1 / 60);
    hud.textContent = 'Reduced motion is on: showing a still frame. Click the hero to animate.';
    canvas.addEventListener('pointerdown', () => requestAnimationFrame(frame), { once: true });
  } else requestAnimationFrame(frame);
});
