  PROTOTYPE — throwaway visual spike, round 4. Not production code. Built by build.sh (inlines the WASM).
  Question: welding-spark currents around always-readable text, with a click-and-hold forcefield.
  Physics: sim/ (Rust → WASM): sparks from wandering torches ride a curl-noise current field, ricochet off every
  [data-collide] element (name, nav, editable tagline) and the cursor forcefield, and cool over their lifetime.
  Rendering: thin cooling streaks + torch glow → light map + bloom; text is drawn last as an opaque, dark-haloed
  surface with capped lighting so no amount of sparks can wash it out.
  Presets (?variant=, bottom bar, ←/→): currents, forge. Schemes: the swatches in the nav (also ?palette=, P).
  ?capture=1 frame-exact recording · ?warm=<frames> · ?n=<sparks> · ?tune=1 sliders.
-->

<style>

  .name { position: absolute; left: 0; right: 0; top: 24%; margin: 0; text-align: center; pointer-events: none;
    font: var(--weight) clamp(48px, 10.5vw, 160px)/0.98 var(--font); letter-spacing: var(--track); text-transform: uppercase; }
  .tagline { position: absolute; left: 50%; transform: translateX(-50%); top: 66%; width: min(760px, 90vw); margin: 0;

  .hint { position: absolute; left: 50%; transform: translateX(-50%); bottom: 22px; margin: 0; pointer-events: none; white-space: nowrap;
    font: 500 11px/1 ui-monospace, Consolas, monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .projects { max-width: 760px; margin: 0 auto; padding: 96px 16px 160px; }

  .projects ul { list-style: none; padding: 0; margin: 0; }
  .projects li { display: flex; justify-content: space-between; gap: 16px; padding: 18px 0; border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
  .projects a { color: var(--fg); text-decoration: none; font-size: 22px; font-weight: 600; }
  .projects span { color: var(--muted); font-size: 14px; align-self: center; }
  .hud { position: fixed; top: 56px; left: 12px; z-index: 10; pointer-events: none; white-space: pre-wrap; max-width: calc(100vw - 24px);
    font: 12px/1.5 ui-monospace, Consolas, monospace; color: #cfd3e0; background: rgba(0,0,0,.6); padding: 8px 10px; border-radius: 8px; }
  .tune { position: fixed; top: 130px; left: 12px; z-index: 10; display: grid; gap: 6px; padding: 10px; border-radius: 8px;
    background: rgba(0,0,0,.75); font: 12px ui-monospace, Consolas, monospace; color: #cfd3e0; }
  .tune label { display: grid; grid-template-columns: 90px 140px 48px; align-items: center; gap: 8px; }
  .switcher { position: fixed; left: 50%; bottom: calc(48px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 10;
    display: flex; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 32px); align-items: center; gap: 10px;
    background: #fff; color: #111; border-radius: 999px; padding: 6px 8px; box-shadow: 0 6px 24px rgba(0,0,0,.5); font: 600 13px system-ui, sans-serif; }

// Sparks: thin streaks along their velocity; white-hot when fresh or on impact, cooling to the palette, then dark.
const VS_SPARK = HEAD + PAL + CLIP + `
layout(location=0) in vec4 aPV; layout(location=1) in vec4 aEHT;   // x, y, vx, vy · energy, hue, heat, -

const FS_SPARK = HEAD + `in vec2 vL; in float vHalf, vW; in vec3 vCol; out vec4 o;

// Torch heads: a flickering arc glow where each emitter sits.
const VS_TORCH = HEAD + PAL + CLIP + `

const FS_FINAL = HEAD + `
uniform sampler2D uScene, uB1, uB2, uB3, uLight, uText, uSdf;
uniform vec2 uCanvas, uSdfTexel, uRes; uniform float uBloom, uTime;

// ---------- Text → obstacles ----------
// Every word of every [data-collide] element is drawn where the DOM laid it out: red = fill, green = outline.
function rasterizeText(scale, w, h, outline) {
  const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = Math.max(1, h);
  const x = c.getContext('2d', { willReadFrequently: true });

  const hr = hero.getBoundingClientRect();
  for (const el of hero.querySelectorAll('[data-collide]')) {
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    for (let node; (node = walker.nextNode());) {
      const cs = getComputedStyle(node.parentElement), fs = parseFloat(cs.fontSize);
      x.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
      if ('letterSpacing' in x) x.letterSpacing = `${parseFloat(cs.letterSpacing) || 0}px`;
      const upper = cs.textTransform === 'uppercase';
      for (const m of node.data.matchAll(/\S+/g)) {
        const range = document.createRange(); range.setStart(node, m.index); range.setEnd(node, m.index + m[0].length);
        const r = range.getClientRects()[0]; if (!r) continue;
        const word = upper ? m[0].toUpperCase() : m[0], met = x.measureText(word);
        const asc = met.fontBoundingBoxAscent, desc = met.fontBoundingBoxDescent;
        const bx = r.left - hr.left, by = r.top - hr.top + (r.height - (asc + desc)) / 2 + asc;

}
let textTex = null, sdfTex = null, sdfSize = [1, 1], obstacleTimer = 0;
function updateObstacles() {
  if (!world) return;

  textTex = mkTex(0, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, rasterizeText(DPR, canvas.width, canvas.height, true), gl.LINEAR, true);
  const mw = Math.ceil(W * 0.5), mh = Math.ceil(H * 0.5), px = rasterizeText(0.5, mw, mh, false).getContext('2d').getImageData(0, 0, mw, mh).data;
  const maskPtr = X.world_mask_alloc(world, mw, mh, 0.5);   // may grow WASM memory: take the buffer view after
  const mask = new Uint8Array(X.memory.buffer, maskPtr, mw * mh);
  for (let i = 0; i < mw * mh; i++) mask[i] = px[i * 4];

  if (torches.length) {
    use(PROG.torch, {}, { uRes: [W, H], uTorch: torches, uScale: emit ? 1.5 : 1.0, ...P });
    gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, torches.length / 4);

}
let simT = 0, simMs = 0, active = 0;

  updateShield(dt);
  const t0 = performance.now(); X.world_step(world, dt); simMs = simMs * 0.9 + (performance.now() - t0) * 0.1;
  shield.flash = Math.max(shield.flash * Math.pow(0.02, dt), Math.min(1, X.world_shield_hits(world) / 30));
  active = X.world_active(world);
  gl.bindBuffer(gl.ARRAY_BUFFER, vbo); gl.bufferSubData(gl.ARRAY_BUFFER, 0, new Float32Array(X.memory.buffer, X.world_out_ptr(world), active * 8));
  const ne = X.world_emitter_count(world), em = new Float32Array(X.memory.buffer, X.world_emitters_ptr(world), ne * 8), torches = [];
  for (let i = 0; i < ne; i++) torches.push(em[i * 8], em[i * 8 + 1], em[i * 8 + 3], em[i * 8 + 4]);

  drawSparksAndTorches(P, 1.0, torches);

  use(PROG.fade, {}, { uKeep: Math.pow(0.86, dt * 60) }); tri(); gl.disable(gl.BLEND);
  drawSparksAndTorches(P, 0.0, torches);

  use(PROG.final, { uScene: scene.t, uB1: bloom[0][0].t, uB2: bloom[1][0].t, uB3: bloom[2][0].t, uLight: light.t, uText: textTex, uSdf: sdfTex },
    { uCanvas: [canvas.width, canvas.height], uSdfTexel: [1 / sdfSize[0], 1 / sdfSize[1]], uRes: [W, H], uBloom: 0.7, uTime: simT,
      uShield: [mouse.x, mouse.y, shield.r, shield.flash], ...P });

}
let last = 0, frames = 0, fpsT = 0, fps = 0;
function frame(now) {

    hud.textContent = `${VARIANTS[vi].label} / ${pal().label} — ${active.toLocaleString()} sparks · physics ${simMs.toFixed(1)} ms (Rust/WASM) · ${fps.toFixed(0)} fps\n${VARIANTS[vi].hint}\n←/→ preset · p: scheme`; }
  if (scrollY > H) return;

}
if (capture) document.querySelectorAll('.hud, .switcher, .hint').forEach(e => e.hidden = true);
build().then(() => {
  for (let i = 0, n = parseInt(qs.get('warm'), 10) || 0; i < n; i++) { X.world_step(world, 1 / 60); simT += 1 / 60; }  // physics only
  if (capture) window.__capture = { frame: present };
  else if (reduceMotion) {
    for (let i = 0; i < 120; i++) X.world_step(world, 1 / 60);
    present(1 / 60);
    hud.textContent = 'Reduced motion is on: showing a still frame. Click the hero to animate.';
    canvas.addEventListener('pointerdown', () => requestAnimationFrame(frame), { once: true });
  } else requestAnimationFrame(frame);
});
</script>
