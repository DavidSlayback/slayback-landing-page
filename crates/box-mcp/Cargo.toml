[package]
name = "box-mcp"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Escape the Box as an MCP server: LLM agents play the headless game turn by turn through tools (ML track M5, docs/planning/ml-track.md)."

[dependencies]
box-env = { path = "../box-env" }
game-core = { path = "../game-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
