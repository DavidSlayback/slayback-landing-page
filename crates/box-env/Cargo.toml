[package]
name = "box-env"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Escape the Box as an RL environment: reset/step over the headless game, a reward, traces that replay (ML track, docs/planning/ml-track.md)."

[dependencies]
game-core = { path = "../game-core" }
game3d = { path = "../game3d", default-features = false }
# Only what game3d's headless build already pulls in.
bevy = { version = "=0.19.1", default-features = false, features = ["std", "bevy_state"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
