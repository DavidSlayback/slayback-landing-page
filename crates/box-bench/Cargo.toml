[package]
name = "box-bench"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Escape the Box as an agent benchmark: runs headless Claude Code over seeds x trials through box-mcp, replays every result, classifies failures (ML track M6, docs/planning/ml-track.md)."

[dependencies]
box-env = { path = "../box-env" }
box-mcp = { path = "../box-mcp" }
game-core = { path = "../game-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
