<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escape the box · David Slayback</title>
<meta name="description" content="A Rumble Box-style brawler in Rust and WebAssembly.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Cpath d='M6 26 L16 14 M16 14 L27 6 M16 14 L24 18 M16 14 L12 5' stroke='%23a6ff00' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #a6ff00; font: 600 14px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  /* The canvas sits above the loading note; Bevy's first frame covers it. */
  .loading { position: fixed; inset: 0; display: grid; place-items: center; margin: 0; letter-spacing: .2em; text-transform: uppercase; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
  .back { position: fixed; top: 34px; left: 40px; z-index: 1; color: inherit; text-decoration: none; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; }
</style>
</head>
<body>
<p class="loading">Loading the box…</p>
<canvas id="game" tabindex="0" aria-label="Escape the box game"></canvas>
<a class="back" href="../">← Back</a>
<script type="module">
  import init from './game.js';
  const canvas = document.getElementById('game');
  canvas.focus();
  canvas.addEventListener('contextmenu', e => e.preventDefault());   // right-click is kick
  // winit drives Bevy's loop by throwing out of the first call on the web; that throw is expected.
  init().catch(e => { if (!String(e).includes('Using exceptions for control flow')) throw e; });
</script>
</body>
</html>
