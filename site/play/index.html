<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escape the box · David Slayback</title>
<meta name="description" content="A Rumble Box-style brawler in Rust and WebAssembly.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Cpath d='M6 26 L16 14 M16 14 L27 6 M16 14 L24 18 M16 14 L12 5' stroke='%23a6ff00' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #a6ff00; font: 600 14px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  /* The canvas sits above the loading note; Bevy's first frame covers it. */
  .loading { position: fixed; inset: 0; display: grid; place-items: center; margin: 0; letter-spacing: .2em; text-transform: uppercase; }
  /* A 16:9 stage of at most 1280x720 CSS px, scaled up to fit by a transform: with the game's scale factor fixed at 1,
     the backbuffer never exceeds 1280x720, which keeps the look within budget on integrated GPUs (B2). */
  #stage { position: fixed; left: 50%; top: 50%; width: 1280px; height: 720px; transform: translate(-50%, -50%); }
  /* touch-action: the game takes every touch (Q78), so the browser neither scrolls nor zooms under a thumb. */
  #game { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  /* On a dark pill like the game's HUD panel: the boxes' backdrops run from white to black (Q75). */
  .back { position: fixed; top: 26px; left: 28px; z-index: 1; padding: 6px 12px; border-radius: 8px; background: rgba(0,0,0,.6); color: inherit; text-decoration: none; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; }
  /* The tour clip (crates/game3d/src/demo.rs, tour=1): a run through every move and out of a mini box, at double
     speed, in the slot the start and pause screens leave free (screens::CLIP: 4% from the right, 32% down, 36% x 36%
     of the stage). Shown only on those screens; the game sets html[data-phase]. */
  #tour { display: none; position: absolute; right: 4%; top: 32%; width: 36%; height: 36%; margin: 0; pointer-events: none; }
  #tour video { width: 100%; height: 100%; object-fit: contain; display: block; border-radius: 6px; box-shadow: 0 0 0 1px rgba(166,255,0,.35); }
  #tour figcaption { position: absolute; left: 8px; top: 8px; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,.6); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  html[data-phase="start"] #tour, html[data-phase="paused"] #tour { display: block; }
  /* The touch controls want both thumbs: a phone held upright is asked to turn. */
  .turn { display: none; }
  @media (pointer: coarse) and (orientation: portrait) {
    .turn { display: grid; place-items: center; position: fixed; inset: 0; z-index: 2; margin: 0; padding: 0 32px;
      background: #000; text-align: center; letter-spacing: .2em; text-transform: uppercase; }
  }
</style>
</head>
<body>
<p class="loading">Loading the box…</p>
<div id="stage"><canvas id="game" tabindex="0" aria-label="Escape the box game"></canvas>
  <figure id="tour"><video src="tour.mp4" poster="tour.jpg" muted loop playsinline preload="auto" aria-label="A run through every move: punch, kick, drop-kick, spin-throw, grabbing a block, and climbing out"></video><figcaption>How to escape · 2×</figcaption></figure>
</div>
<a class="back" href="../">← Back</a>
<p class="turn">Turn your phone sideways to play</p>
<script>
  { // Sound: browsers start audio suspended until the visitor interacts (the autoplay policy), and the game's audio
    // backend (cpal) creates its AudioContext while the game loads and asks to resume it only then, so it would stay
    // silent for good. Keep each context the game makes and resume it on every click, key or tap until it runs.
    const Native = window.AudioContext || window.webkitAudioContext;
    if (Native) {
      const contexts = window.gameAudio = [];
      window.AudioContext = class extends Native { constructor(...a) { super(...a); contexts.push(this); } };
      const wake = () => { for (const c of contexts) if (c.state === 'suspended') c.resume().catch(() => {}); };
      for (const type of ['pointerdown', 'keydown', 'touchend']) addEventListener(type, wake, { capture: true });
    }
  }
  { // The tour clip plays only while it shows (the start and pause screens), so it costs nothing during play.
    const clip = document.querySelector('#tour video'), root = document.documentElement;
    new MutationObserver(() => {
      if (['start', 'paused'].includes(root.dataset.phase)) clip.play().catch(() => {}); else clip.pause();
    }).observe(root, { attributes: true, attributeFilter: ['data-phase'] });
  }
  { // Size the stage: 16:9, at most 1280 px wide in layout, then scaled to fill the viewport. On a touch screen it
    // fills the whole screen instead (still at most 1280x720 in layout), so the touch controls reach its edges.
    const stage = document.getElementById('stage');
    const touch = matchMedia('(pointer: coarse)').matches;
    const fit = () => {
      let w = Math.floor(Math.min(1280, innerWidth, innerHeight * 16 / 9)), h = Math.floor(w * 9 / 16);
      if (touch) {
        const s = Math.max(1, innerWidth / 1280, innerHeight / 720);
        w = Math.floor(innerWidth / s); h = Math.floor(innerHeight / s);
      }
      const k = Math.min(innerWidth / w, innerHeight / h);
      Object.assign(stage.style, { width: `${w}px`, height: `${h}px`, transform: `translate(-50%, -50%) scale(${k})` });
    };
    addEventListener('resize', fit);
    fit();
    // On a phone, the first touch asks for the whole screen, held sideways (Android; iOS keeps its browser bars).
    if (touch) addEventListener('pointerdown', () => {
      document.documentElement.requestFullscreen?.({ navigationUI: 'hide' })
        .then(() => screen.orientation?.lock?.('landscape')).catch(() => {});
    }, { once: true });
  }
</script>
<script type="module">
  async function start() {
    document.getElementById('game').focus();
    const { default: init } = await import('./game.js');
    // winit drives Bevy's loop by throwing out of the first call on the web; that throw is expected.
    init().catch(e => { if (!String(e).includes('Using exceptions for control flow')) throw e; });
  }
  start();
</script>
</body>
</html>
