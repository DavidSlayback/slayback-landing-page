<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>David Slayback</title>
<meta name="description" content="David Slayback: reinforcement learning, LLM agents and ML systems.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Cpath d='M6 26 L16 14 M16 14 L27 6 M16 14 L24 18 M16 14 L12 5' stroke='%23a6ff00' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: dark; --bg: #000; --fg: #eafffb; --muted: #6f8f8a; --accent: #a6ff00; --font: "Chakra Petch", "Segoe UI", system-ui, sans-serif; --weight: 700; --track: .04em; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); }
  .hero { position: relative; height: 100vh; height: 100svh; overflow: hidden; background: #000; }
  #c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
  /* Hero text is real, selectable DOM; WebGL draws it as a lit, always-opaque surface, so the DOM copy is transparent. */
  .gl .hero [data-collide], .gl .hero [data-collide] * { color: transparent; }
  .gl .hero ::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); color: transparent; }
  .hero [data-collide] a { color: inherit; }
  .name { color: var(--fg); }
  .tagline, .topnav { color: var(--accent); }
  .topbar { position: absolute; top: 20px; left: 28px; right: 28px; display: flex; justify-content: space-between; align-items: center; gap: 16px; pointer-events: none; }
  .topnav { display: flex; gap: 28px; margin: 0; font: 600 15px/1 var(--font); letter-spacing: .14em; text-transform: uppercase; pointer-events: auto; }
  .topnav a { text-decoration: none; }
  .topnav a:focus-visible { outline: 1px solid var(--accent); outline-offset: 6px; }
  .schemes { display: flex; gap: 10px; pointer-events: auto; }
  .schemes button { width: 16px; height: 16px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; background: var(--sw);
    box-shadow: 0 0 10px var(--sw); opacity: .55; transition: opacity .15s, transform .15s; }
  .schemes button[aria-pressed="true"] { opacity: 1; transform: scale(1.25); outline: 1px solid var(--sw); outline-offset: 3px; }
  .schemes button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .name { position: absolute; left: 0; right: 0; top: 24%; margin: 0; text-align: center; pointer-events: none;
    font: var(--weight) clamp(48px, 10.5vw, 160px)/0.98 var(--font); letter-spacing: var(--track); text-transform: uppercase; }
  .tagline { position: absolute; left: 50%; transform: translateX(-50%); top: 66%; width: min(960px, 92vw); text-wrap: balance; margin: 0;
    text-align: center; font: 600 clamp(16px, 2.1vw, 26px)/1.3 var(--font); letter-spacing: .03em; caret-color: var(--accent); outline: none; }
  .tagline:focus-visible { box-shadow: 0 1px 0 color-mix(in srgb, var(--accent) 50%, transparent); }
  /* GAME_RELEASE */
  .cta { position: absolute; left: 50%; transform: translateX(-50%); top: 80%; margin: 0; white-space: nowrap; color: var(--accent);
    font: 600 clamp(13px, 1.4vw, 17px)/1 var(--font); letter-spacing: .14em; text-transform: uppercase; text-decoration: none; }
  .cta:focus-visible { outline: 1px solid var(--accent); outline-offset: 6px; }
  /* /GAME_RELEASE */
  .projects { max-width: 760px; margin: 0 auto; padding: 96px 16px 160px; }
  .projects h2 { font-size: 13px; letter-spacing: .2em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .projects ul { list-style: none; padding: 0; margin: 0; }
  .projects li { display: flex; justify-content: space-between; gap: 16px; padding: 18px 0; border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
  .projects a { color: var(--fg); text-decoration: none; font-size: 22px; font-weight: 600; }
  .projects span { color: var(--muted); font-size: 14px; align-self: center; }
  .hud { position: fixed; top: 56px; left: 12px; z-index: 10; pointer-events: none; white-space: pre-wrap; max-width: calc(100vw - 24px);
    font: 12px/1.5 ui-monospace, Consolas, monospace; color: #cfd3e0; background: rgba(0,0,0,.6); padding: 8px 10px; border-radius: 8px; }
  @media (max-width: 560px) { .topbar { left: 16px; right: 16px; } .topnav { gap: 14px; font-size: 11px; } }
</style>
</head>
<body>
<section class="hero" id="hero">
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="topbar">
    <div class="schemes" role="group" aria-label="Colour scheme"></div>
    <nav class="topnav" data-collide aria-label="Site"><!-- GAME_RELEASE --><a href="play/">Play</a><!-- /GAME_RELEASE --><a href="https://github.com/DavidSlayback">GitHub</a></nav>
  </div>
  <h1 class="name" data-collide data-erode>David<br>Slayback</h1>
  <p class="tagline" id="tagline" data-collide>Reinforcement learner. Agent wrangler. Recovering gradient descender.</p>
  <!-- GAME_RELEASE -->
  <a class="cta" href="play/" data-collide>Play the game →</a>
  <!-- /GAME_RELEASE -->
</section>
<div class="hud" id="hud"></div>
<script src="hero.js" defer></script>
<!-- GAME_RELEASE -->
<script>
  { // Easter egg: the Konami code (up up down down left right left right B A) opens the game.
    const code = 'arrowup,arrowup,arrowdown,arrowdown,arrowleft,arrowright,arrowleft,arrowright,b,a';
    let keys = [];
    addEventListener('keydown', e => {
      keys = [...keys, e.key.toLowerCase()].slice(-10);
      if (keys.join() === code) location.href = 'play/';
    });
  }
</script>
<!-- /GAME_RELEASE -->
</body>
</html>
